<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="fediverse:creator" content="@stackotter@mastodon.social">
        <meta name="viewport" content="width=device-width">
        <meta name="description" content="{description}">
        <link rel="stylesheet" href="/css/page.css">
        <link rel="me" href="https://mastodon.social/@stackotter">

        <!-- Google tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-7ZNG4PJZEX"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {{
              dataLayer.push(arguments)
            }};
            gtag('js', new Date());

            gtag('config', 'G-7ZNG4PJZEX');
        </script>

        <title>{title}</title>
    </head>

    <body>
        <div class="container">
            <div class="background">
              <div class="left-stream">
                <img src="/image/stream.png" class="stream-image">
                <div class="otter-holder otter-holder-1">
                    <img src="/image/otter-donut.png" class="otter-donut otter-donut-1">
                </div>
                <div class="otter-holder otter-holder-2">
                    <img src="/image/otter-donut.png" class="otter-donut otter-donut-2">
                </div>
                <div class="otter-holder otter-holder-3">
                    <img src="/image/otter-donut.png" class="otter-donut otter-donut-3">
                </div>
              </div>
              <div class="right-stream">
                <img src="/image/stream.png" class="stream-image">
                <div class="otter-holder otter-holder-4">
                    <img src="/image/otter-donut.png" class="otter-donut otter-donut-4">
                </div>
                <div class="otter-holder otter-holder-5">
                    <img src="/image/otter-donut.png" class="otter-donut otter-donut-5">
                </div>
                <div class="otter-holder otter-holder-6">
                    <img src="/image/otter-donut.png" class="otter-donut otter-donut-6">
                </div>
              </div>
            </div>

            <main class="main">
                <div class="markdown-body">
                    {content}
                </div>
            </main>
        </div>
    </body>
</html>
